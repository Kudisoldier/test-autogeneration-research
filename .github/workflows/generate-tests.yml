name: Generate Tests

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model (short name or full id)"
        required: true
        default: "llama-3.1-8b-free"
      manifest:
        description: "Pipeline manifest path"
        required: true
        type: choice
        options:
          - specs/pipeline/examples/unit_ui.manifest.json
          - specs/pipeline/examples/unit_server.manifest.json
          - specs/pipeline/examples/integration_ui.manifest.json
          - specs/pipeline/examples/integration_server.manifest.json
          - specs/pipeline/examples/e2e.manifest.json
        default: specs/pipeline/examples/unit_ui.manifest.json
      run_id:
        description: "Optional run directory name under research-output/runs"
        required: false
        default: ""

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate OpenRouter key
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY is not configured in repository secrets."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Chromium (E2E / pipeline verify)
        run: npx playwright install --with-deps chromium

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Resolve run metadata
        id: run_meta
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="run-${{ github.run_id }}"
          fi
          RUN_DIR="research-output/runs/${RUN_ID}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

      - name: Run pipeline (plan -> generate -> verify -> report)
        run: >
          npm run pipeline:all -- --manifest "${{ inputs.manifest }}"
          --model "${{ inputs.model }}"
          --run-id "${{ steps.run_meta.outputs.run_id }}"
          --run-tests

      - name: Publish evaluation summary
        run: |
          node -e '
          const fs = require("fs");
          const runDir = process.env.RUN_DIR;
          const reportPath = `${runDir}/evaluation-report.json`;
          const reportMdPath = `${runDir}/report.md`;
          const reportMetaPath = `${runDir}/report.meta.json`;
          const planMetaPath = `${runDir}/plan.meta.json`;
          const generateMetaPath = `${runDir}/generate.meta.json`;
          let md = "## Pipeline Summary\n\n";

          if (fs.existsSync(reportPath)) {
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const summary = report.summary || {};
            const successRate = summary.totalTests > 0
              ? ((summary.totalPassed / summary.totalTests) * 100).toFixed(1)
              : "0.0";

            md += "| Metric | Value |\n";
            md += "|---|---:|\n";
            md += `| Files evaluated | ${summary.total || 0} |\n`;
            md += `| Files executed | ${summary.runs || 0} |\n`;
            md += `| Passing files | ${summary.passes || 0} |\n`;
            md += `| Total test cases | ${summary.totalTests || 0} |\n`;
            md += `| Passed test cases | ${summary.totalPassed || 0} |\n`;
            md += `| Failed test cases | ${summary.totalFailed || 0} |\n`;
            md += `| Success rate | ${successRate}% |\n\n`;
            md += "| Additional Metric | Value |\n";
            md += "|---|---:|\n";
            md += `| Flaky files | ${summary.flakyFiles || 0} |\n`;
            md += `| Flaky failures | ${summary.flakyFailures || 0} |\n`;
            md += `| Flaky test rate | ${((summary.flakyTestRate || 0) * 100).toFixed(1)}% |\n`;
            md += `| Avg TTG (s) | ${(summary.ttgSecondsAvg || 0).toFixed(3)} |\n\n`;

            const byTypeCoverage = report.byTypeCoverage || {};
            const unitCoverage = byTypeCoverage.unit || {};
            const integrationCoverage = byTypeCoverage.integration || {};
            const pct = (v) => typeof v === "number" && Number.isFinite(v) ? `${v.toFixed(1)}%` : "n/a";
            md += "### Code Coverage (lines)\n\n";
            md += "| Test type | Generated |\n";
            md += "|---|---:|\n";
            md += `| Unit | ${pct(unitCoverage.generatedLinesPct)} |\n`;
            md += `| Integration | ${pct(integrationCoverage.generatedLinesPct)} |\n\n`;
          } else {
            md += "Evaluation report was not found.\n\n";
          }

          if (fs.existsSync(reportMetaPath)) {
            const reportMeta = JSON.parse(fs.readFileSync(reportMetaPath, "utf8"));
            const coverage = reportMeta.coverage_totals || {};
            const implemented = Number(coverage.implemented || 0);
            const passed = Number(coverage.passed || 0);
            const coverageRate = implemented > 0 ? ((passed / implemented) * 100).toFixed(1) : "0.0";

            md += "### Coverage\n\n";
            md += "| Metric | Value |\n";
            md += "|---|---:|\n";
            md += `| Plan cases total | ${coverage.total || 0} |\n`;
            md += `| Implemented | ${implemented} |\n`;
            md += `| Passed | ${passed} |\n`;
            md += `| Failed | ${coverage.failed || 0} |\n`;
            md += `| Not run | ${coverage.notRun || 0} |\n`;
            md += `| Not implemented | ${coverage.notImplemented || 0} |\n`;
            md += `| Pending | ${coverage.pending || 0} |\n`;
            md += `| Coverage pass rate | ${coverageRate}% |\n\n`;
          } else {
            md += "Coverage data (`report.meta.json`) was not found.\n\n";
          }

          const readSeconds = (filePath) => {
            if (!fs.existsSync(filePath)) return null;
            try {
              const parsed = JSON.parse(fs.readFileSync(filePath, "utf8"));
              return typeof parsed.seconds === "number" ? parsed.seconds : null;
            } catch {
              return null;
            }
          };
          const planSeconds = readSeconds(planMetaPath);
          const generateSeconds = readSeconds(generateMetaPath);
          const totalGenSeconds =
            (planSeconds != null || generateSeconds != null)
              ? (planSeconds || 0) + (generateSeconds || 0)
              : null;

          md += "### Time To Generate\n\n";
          md += "| Stage | Seconds |\n";
          md += "|---|---:|\n";
          md += `| Plan | ${planSeconds != null ? planSeconds.toFixed(3) : "n/a"} |\n`;
          md += `| Generate | ${generateSeconds != null ? generateSeconds.toFixed(3) : "n/a"} |\n`;
          md += `| Plan + Generate | ${totalGenSeconds != null ? totalGenSeconds.toFixed(3) : "n/a"} |\n\n`;

          if (fs.existsSync(reportMdPath)) {
            const reportMarkdown = fs.readFileSync(reportMdPath, "utf8").trim();
            md += "### Report\n\n";
            if (reportMarkdown.length > 0) {
              md += reportMarkdown + "\n\n";
            } else {
              md += "Report markdown file is empty.\n\n";
            }
          } else {
            md += "Reporter markdown was not found.\n\n";
          }

          md += `Run directory: ${runDir}\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '
        env:
          RUN_DIR: ${{ steps.run_meta.outputs.run_dir }}

      - name: Upload pipeline artifacts (metrics + report)
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts-${{ github.run_id }}
          path: |
            ${{ steps.run_meta.outputs.run_dir }}/context_manifest.json
            ${{ steps.run_meta.outputs.run_dir }}/test_plan.json
            ${{ steps.run_meta.outputs.run_dir }}/test_plan.md
            ${{ steps.run_meta.outputs.run_dir }}/plan.meta.json
            ${{ steps.run_meta.outputs.run_dir }}/generate.meta.json
            ${{ steps.run_meta.outputs.run_dir }}/verify.log
            ${{ steps.run_meta.outputs.run_dir }}/evaluation-report.json
            ${{ steps.run_meta.outputs.run_dir }}/jest-results.json
            ${{ steps.run_meta.outputs.run_dir }}/report.md
            ${{ steps.run_meta.outputs.run_dir }}/report.meta.json
            ${{ steps.run_meta.outputs.run_dir }}/generated/**
          if-no-files-found: error
