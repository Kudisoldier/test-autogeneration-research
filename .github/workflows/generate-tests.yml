name: Generate Tests

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model (short name or full id)"
        required: true
        default: "llama-3.1-8b-free"
      type:
        description: "Test type"
        required: true
        type: choice
        options:
          - unit
          - integration
          - e2e
        default: unit
      target:
        description: "Target (FeedbackForm, FeedbackList, validation, api, feedback-form)"
        required: false
        default: "FeedbackForm"
      generate_all:
        description: "Generate all targets for selected type"
        required: true
        type: boolean
        default: false
      output_dir:
        description: "Output directory for generated files"
        required: true
        default: "research-output"

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate OpenRouter key
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY is not configured in repository secrets."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Generate tests for selected target
        if: ${{ inputs.generate_all == false }}
        run: >
          npm run generate:test -- --model "${{ inputs.model }}"
          --type "${{ inputs.type }}"
          --target "${{ inputs.target }}"
          --output-dir "${{ inputs.output_dir }}"

      - name: Generate tests for all targets
        if: ${{ inputs.generate_all == true }}
        run: >
          npm run generate:all -- --type "${{ inputs.type }}"
          --output-dir "${{ inputs.output_dir }}"

      - name: Upload generated tests artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests-${{ github.run_id }}
          path: ${{ inputs.output_dir }}
          if-no-files-found: error

  evaluate:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Download generated tests artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-tests-${{ github.run_id }}
          path: ${{ inputs.output_dir }}

      - name: Evaluate generated tests
        run: npm run evaluate:tests -- "${{ inputs.output_dir }}"

      - name: Publish evaluation summary
        run: |
          node -e '
          const fs = require("fs");
          const reportPath = `${process.env.OUTPUT_DIR}/evaluation-report.json`;
          if (!fs.existsSync(reportPath)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Evaluation Summary\n\nReport file was not found.\n");
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const summary = report.summary || {};
          const successRate = summary.totalTests > 0
            ? ((summary.totalPassed / summary.totalTests) * 100).toFixed(1)
            : "0.0";

          let md = "## Evaluation Summary\n\n";
          md += "| Metric | Value |\n";
          md += "|---|---:|\n";
          md += `| Files evaluated | ${summary.total || 0} |\n`;
          md += `| Files executed | ${summary.runs || 0} |\n`;
          md += `| Passing files | ${summary.passes || 0} |\n`;
          md += `| Total test cases | ${summary.totalTests || 0} |\n`;
          md += `| Passed test cases | ${summary.totalPassed || 0} |\n`;
          md += `| Failed test cases | ${summary.totalFailed || 0} |\n`;
          md += `| Success rate | ${successRate}% |\n\n`;

          const byType = report.byType || {};
          const types = Object.keys(byType);
          if (types.length > 0) {
            md += "### By Type\n\n";
            md += "| Type | Files | Passing Files | Tests | Passed | Failed | Success Rate |\n";
            md += "|---|---:|---:|---:|---:|---:|---:|\n";
            for (const type of types) {
              const s = byType[type] || {};
              const typeRate = s.testCount > 0 ? ((s.passCount / s.testCount) * 100).toFixed(1) : "0.0";
              md += `| ${type} | ${s.total || 0} | ${s.passes || 0} | ${s.testCount || 0} | ${s.passCount || 0} | ${s.failCount || 0} | ${typeRate}% |\n`;
            }
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}

      - name: Upload evaluation report artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-${{ github.run_id }}
          path: ${{ inputs.output_dir }}/evaluation-report.json
          if-no-files-found: warn
